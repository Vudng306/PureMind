services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: puremind
      POSTGRES_PASSWORD: puremind
      POSTGRES_DB: puremind
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # POSTGRES_PORT / BACKEND_PORT / FRONTEND_PORT in .env change the host ports if they are taken.
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puremind"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://puremind:puremind@db:5432/puremind
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
